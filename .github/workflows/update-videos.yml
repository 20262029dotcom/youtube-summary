name: 유튜브 영상 요약 업데이트

on:
  schedule:
    # 한국 시간 07:00 (GitHub는 UTC 기준이라 9시간을 뺀 값)
    # GitHub 사정에 따라 몇 분~수십 분 늦게 실행될 수 있다
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: yt-dlp 설치 (채널 전체 영상 목록용)
        run: pip install -U yt-dlp

      - name: 영상 수집·요약
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          MAX_MINUTES: ${{ vars.MAX_MINUTES }}
          BACKLOG_ORDER: ${{ vars.BACKLOG_ORDER }}
          PRIORITY_KEYWORD: ${{ vars.PRIORITY_KEYWORD }}
        run: python scripts/collect.py

      - name: 결과 저장
        run: |
          git config user.name "video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "영상 요약 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
